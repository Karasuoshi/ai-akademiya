<style>
/* Layout: entry screen (who plays + doors to worlds, shared stars) → world «Квартира 82»:
   night floor plan / room cut-away on the left, game panel on the right, Alice's line under the scene. Phone: stacked. */
:root{
  --night:#0E1430; --panel:#18203F; --panel2:#222C55; --line:#33407A;
  --ink:#EEF1FF; --muted:#A6AED3;
  --lamp:#FFC94D; --lamp-ink:#3A2600; --alice:#8EE3CE; --alice-ink:#08302A;
  --good:#A9E592; --good-ink:#163A0C; --bad:#FF9F8C; --bad-ink:#4A1206;
  --wall:#E8D6B4; --wall2:#D6BF97; --wood:#A8733F; --wood2:#7E522A; --floor:#8A5C36;
  --sky:#1D2C61; --bedding:#F4F0E6; --blue:#5DA6DE; --pink:#E58FB5; --green:#6FBF8A; --glass:#BFD3E6;
  --f-display:"Pangolin","Comic Sans MS","Chalkboard SE",cursive;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}[hidden]{display:none!important}img{max-width:100%}html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--night);color:var(--ink);font:15px/1.45 var(--f-body)}
button,input{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.wrap>*{min-width:0}
:focus-visible{outline:3px solid var(--alice);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand h1{margin:0;font:400 clamp(24px,4vw,34px)/1 var(--f-display)}
.brand small{display:block;margin-top:3px;color:var(--muted);font-size:13px}
.me{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:400 17px var(--f-display);color:var(--night);flex:none}
.stars{display:inline-flex;align-items:center;gap:4px;color:var(--lamp);font-weight:800;font-variant-numeric:tabular-nums}

/* hub */
.hub{display:grid;gap:22px}
.hero{display:grid;gap:4px}
.hero h2{margin:0;font:400 clamp(26px,4.4vw,40px)/1.1 var(--f-display);text-wrap:balance}
.hero p{margin:0;color:var(--muted)}
.sect{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:0}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pcard{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px;cursor:pointer}
.pcard .av{width:52px;height:52px;font-size:26px;grid-row:span 2}
.pcard b{font:400 24px/1 var(--f-display)}
.pcard .lvl{color:var(--muted);font-size:13.5px}
.pcard .bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--night);overflow:hidden;margin-top:6px}
.pcard .bar i{display:block;height:100%;background:var(--lamp);border-radius:4px}
.pcard .meta{grid-column:1/-1;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.pcard[aria-pressed="true"]{border-color:var(--lamp);background:var(--panel2)}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.door{display:grid;gap:8px;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:0 0 14px;cursor:pointer;overflow:hidden}
.door svg{display:block;width:100%;height:auto;background:#121A3C}
.door h3{margin:0 14px;font:400 24px/1.1 var(--f-display)}
.door p{margin:0 14px;color:var(--muted);font-size:14px}
.door .wst{margin:0 14px;display:flex;gap:12px;align-items:center;font-size:13.5px;color:var(--muted)}
.door:hover{border-color:var(--alice)}
.door.soon{cursor:default;border-style:dashed;background:transparent}
.door.soon:hover{border-color:var(--line)}

/* world layout */
.wbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.wbar h2{margin:0;font:400 24px var(--f-display)}
.btn{background:var(--alice);color:var(--alice-ink);border:0;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--panel2);color:var(--ink)}
.btn.lamp{background:var(--lamp);color:var(--lamp-ink)}
.btn.small{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.stage{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}
.scene{background:var(--panel);border-radius:18px;overflow:hidden;border:2px solid var(--line)}
.scene svg{display:block;width:100%;height:auto;max-width:100%;touch-action:manipulation}
.shead{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;padding:10px 14px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.shead h3{margin:0;font:400 21px var(--f-display)}
.shead .muted{font-size:13px}

/* svg pieces */
.fx{cursor:pointer}
.fx .lampbody{fill:#5E6688;stroke:#2A3150;stroke-width:1.5;transition:fill .25s}
.fx .bulb{fill:#7C84A6;transition:fill .25s}
.fx.on .lampbody{fill:var(--lamp)}
.fx.on .bulb{fill:#FFF6D6}
.fx .strip{stroke:#59607E;stroke-width:4;stroke-linecap:round;transition:stroke .25s;fill:none}
.fx.on .strip{stroke:#FFE08A}
.fx .hit{fill:transparent}
.fx .blades{fill:#7C84A6;transform-box:fill-box;transform-origin:center}
.fx.on .blades{fill:var(--alice);animation:spin 1s linear infinite}
.fx .wave{stroke:#59607E;stroke-width:3;fill:none;stroke-linecap:round;transition:stroke .3s}
.fx.on .wave{stroke:#FF8A4C}
.fx .screen{fill:#1A2140;transition:fill .3s}
.fx.on .screen{fill:#6EC3FF}
.fx .pict{opacity:0;transition:opacity .3s}
.fx.on .pict{opacity:1}
.fx .curl,.fx .curr{fill:#9B8FE5;transform-box:fill-box;transition:transform .5s}
.fx .curl{transform-origin:left center}.fx .curr{transform-origin:right center}
.fx.on .curl,.fx.on .curr{transform:scaleX(.22)}
@keyframes spin{to{transform:rotate(360deg)}}
.glow{opacity:0;transition:opacity .45s;mix-blend-mode:screen;pointer-events:none}
.glow.on{opacity:1}
.tag{cursor:pointer}
.tag rect{fill:#121939;stroke:#47548F;stroke-width:1.5;transition:fill .2s,stroke .2s}
.tag text{fill:var(--ink);font:800 13px var(--f-body)}
.tag.on rect{fill:var(--lamp);stroke:var(--lamp)}
.tag.on text{fill:var(--lamp-ink)}
.tag.sel rect{stroke:var(--alice);stroke-width:3}
.dark{transition:opacity .45s;pointer-events:none}
.ring{fill:none;stroke:var(--alice);stroke-width:3;opacity:.35}
.talk .ring{animation:ring 1.2s ease-in-out 2}
@keyframes ring{50%{opacity:1;stroke-width:5}}
.mroom{cursor:pointer}
.mroom:hover .wallr{stroke:var(--alice)}
.mroom .wallr{fill:none;stroke:#0A0F24;stroke-width:6;transition:stroke .2s}
.mroom text{pointer-events:none}
.mdot{fill:#5E6688;transition:fill .3s}
.mdot.on{fill:#FFF0B8}
@media (prefers-reduced-motion:reduce){.glow,.dark,.fx *{transition:none}.talk .ring{animation:none;opacity:1}.fx.on .blades{animation:none}}

/* alice line */
.alice{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:12px 14px;border-top:2px solid var(--line)}
.ctx{font-size:13px;color:var(--muted)}
.ctx b{color:var(--ink)}
.bubbles{display:grid;gap:6px;min-height:58px}
.bub{max-width:100%;padding:7px 12px;border-radius:14px;overflow-wrap:anywhere}
.bub.you{justify-self:end;background:var(--panel2);border-bottom-right-radius:4px}
.bub.al{justify-self:start;background:var(--alice);color:var(--alice-ink);border-bottom-left-radius:4px;font-weight:700}
.bub.hint{justify-self:start;color:var(--muted);background:none;padding:4px 2px}
.alice>*{min-width:0}
.say{display:flex;gap:8px;min-width:0}
.mapwrap{overflow-x:auto}
.mapwrap svg{min-width:560px}
.say input,.nm-in input{flex:1;min-width:0;background:var(--night);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.say input:focus,.nm-in input:focus{outline:none;border-color:var(--alice)}

/* panel */
.panel{background:var(--panel);border:2px solid var(--line);border-radius:18px;display:grid;min-width:0}
.tabs{display:flex;border-bottom:2px solid var(--line)}
.tab{flex:1;background:none;border:0;padding:12px 6px;cursor:pointer;color:var(--muted);font-weight:800;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lamp)}
.pbody{padding:16px;display:grid;gap:14px;min-width:0}
.pbody>*{min-width:0}
.lead{margin:0;color:var(--muted)}
.big{font:400 24px/1.25 var(--f-display);margin:0;text-wrap:balance}
.phrase{font:400 20px/1.3 var(--f-display);color:var(--lamp)}
.card{background:var(--panel2);border-radius:14px;padding:14px;display:grid;gap:8px}
.lbl{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--night);border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13.5px}
.chip.mine{border-color:var(--lamp);color:var(--lamp)}
.chip.pick{cursor:pointer}
.chip.pick[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink);font-weight:800}
.muted{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.magic{display:grid;gap:10px}
.magic>div{display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:center}
.magic .muted{grid-column:1}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;justify-self:start}
.seg button{background:none;border:0;padding:7px 14px;cursor:pointer;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--line);color:var(--ink)}

/* quests */
.prog{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--lamp)}
.dot.cur{box-shadow:0 0 0 3px var(--alice)}
.opts{display:grid;gap:8px}
.optrow{display:flex;gap:8px;align-items:center}
.opt{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;background:var(--night);border:2px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.opt:hover{border-color:var(--alice)}
.opt .pic{flex:none;width:52px;height:52px;border-radius:12px;background:var(--panel2);display:grid;place-items:center}
.opt .txt{font:400 18px/1.25 var(--f-display);flex:1;min-width:0}
.opt.right{border-color:var(--good);background:#1C3324}
.opt.wrong{border-color:var(--bad);background:#3A1F22}
.spk{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--panel2);display:grid;place-items:center;cursor:pointer}
.fb{border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.fb.ok{background:var(--good);color:var(--good-ink)}
.fb.no{background:var(--bad);color:var(--bad-ink)}
.fb b{font:400 20px var(--f-display)}
.mode{font-size:12.5px;color:var(--muted);background:var(--night);border-radius:999px;padding:3px 10px}

/* names */
.nm-in{display:flex;gap:8px}
.check{font-size:14px;padding:8px 12px;border-radius:10px}
.check.ok{background:var(--good);color:var(--good-ink)}
.check.warn{background:var(--lamp);color:var(--lamp-ink)}
.check.bad{background:var(--bad);color:var(--bad-ink)}
.list{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.list li{display:flex;gap:4px 8px;flex-wrap:wrap;align-items:baseline}
.list li span{color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:2px}

/* ai world */
.aiw{max-width:720px;display:grid;gap:14px}

.foot{color:var(--muted);font-size:13px;max-width:80ch;margin:0}
.foot b{color:var(--ink)}
</style>
</head>

function norm(s){return String(s).toLowerCase().replace(/ё/g,'е').replace(/[«»"“”!?;:()—–\-]/g,' ').replace(/[,.]/g,' , ').replace(/\s+/g,' ').trim()}
function stem(aw,tw){const p=aw.length<=4?aw.length-1:aw.length-2;return tw.startsWith(aw.slice(0,Math.max(2,p)))&&Math.abs(tw.length-aw.length)<=3}
function sigw(s){return norm(s).split(' ').filter(w=>w.length>=3||w==='тв')}
function namesOf(d){return d.names.concat(IDEAS.filter(i=>i.kind==='dev'&&i.room===d.room&&i.dev===d.id).map(i=>i.name))}
function roomWords(r){return r.words.concat(IDEAS.filter(i=>i.kind==='room'&&i.room===r.id).map(i=>norm(i.name)))}
function mentionOf(words){for(const r of ROOMS)for(const w of words)if(r.mention.some(m=>w.startsWith(m)))return {room:r.id,word:w};return null}

/* returns {devs:[...]} or {err:'...'} */
function resolve(rest,ctx){
  const men=mentionOf(rest);
  const core=men?rest.filter(w=>w!==men.word):rest;
  const scopeRoom=men?men.room:ctx, heard=men||R[ctx].station;
  if(core.length===1&&core[0]==='бра'&&heard){const b=R[scopeRoom].devices.filter(d=>d.bra);if(b.length)return {devs:b}}
  const pool=men?R[men.room].devices:ALL;
  let top=0,cands=[];
  for(const d of pool){let best=0,bestN='';
    for(const n of namesOf(d)){const aw=sigw(n);if(!aw.length)continue;
      if(aw.every(a=>rest.some(t=>stem(a,t)))&&aw.length>best){best=aw.length;bestN=norm(n)}}
    if(!best)continue;
    if(best>top){top=best;cands=[{d,n:bestN}]}else if(best===top)cands.push({d,n:bestN});
  }
  const restSig=rest.filter(w=>w.length>=3||w==='тв').length;
  const exact=cands.length&&top===restSig;
  if(!exact&&core.length===1&&core[0]==='свет'){
    if(!heard) return {err:'Не знаю, в какой комнате. Скажи: «включи свет в '+inRoom(ctx)+'».'};
    return {devs:lightsOf(scopeRoom)};
  }
  if(!cands.length) return {err:null};
  const rooms=[...new Set(cands.map(c=>c.d.room))];
  if(rooms.length===1) return {devs:cands.map(c=>c.d)};
  if(R[ctx].station&&rooms.includes(ctx)) return {devs:cands.filter(c=>c.d.room===ctx).map(c=>c.d)};
  if(new Set(cands.map(c=>c.n)).size===1&&cands[0].n==='вход') return {devs:cands.map(c=>c.d)};

  for(const r of ROOMS){if(roomWords(r).includes(ph)){r.devices.forEach(d=>{if(d.k===L||d.k===FAN)S[d.gid]=false});return r.id===ctx?'Гашу свет в комнате.':'Гашу свет: '+R[r.id].name+'.'}}
  for(const s of SCEN) if(s.re.test(ph)) return s.fn();
  return 'Не поняла. Скажи, что сделать: «включи…» или «выключи…».';
}
function run(text,ctx){
  const toks=norm(text).split(' ').filter(Boolean);
  if(!toks.length) return 'Я слушаю. Начни с «Алиса, …»';
  const chunks=[];let cur=[];
  for(const t of toks){if(t==='алиса'){if(cur.length)chunks.push(cur);cur=[]}else cur.push(t)}
  if(cur.length)chunks.push(cur);
  const out=[];
  for(const ch of chunks){
    const segs=[];let s=[];
    for(const t of ch){if(SEP.has(t)){if(s.length)segs.push(s);s=[]}else s.push(t)}
    if(s.length)segs.push(s);
    let verb=null;
    for(const seg of segs){
      let v=null;const rest=[];
      for(const w of seg){if(ON.has(w))v='on';else if(OFF.has(w))v='off';else if(!STOP.has(w))rest.push(w)}
      if(v)verb=v;
      const ph=rest.join(' ');
      if(!verb){out.push(scenario(ph,ctx));continue}
      if(!rest.length){out.push(verb==='on'?'Что включить?':'Что выключить?');continue}
      if(/^ночник/.test(ph)){out.push('«Включи ночник» — это команда для подсветки колонки. Для ночного света скажи «Алиса, ночной свет».');continue}
      if(/музык|песн/.test(ph)){out.push(verb==='on'?'Включаю музыку!':'Выключаю музыку.');continue}
      const res=resolve(rest,ctx);
      if(res.err){out.push(res.err);continue}
      if(!res.devs){out.push('Не нашла «'+rest.join(' ')+'». Нажми на лампу — узнаешь её имя.');continue}
      res.devs.forEach(d=>S[d.gid]=verb==='on');
      const cur=res.devs[0].k===CUR;
      out.push(verb==='on'?(cur?'Открываю.':'Включаю.'):(cur?'Закрываю.':'Выключаю.'));
    }
  }
  return [...new Set(out.filter(Boolean))].join(' ');
}

function mapSVG(){
  let clips='',floors='',dark='',glows='',walls='',labels='',dots='';

    clips+=`<clipPath id="cp-${r.id}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath>`;
    floors+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--wall)"/>`;
    dark+=`<rect class="dark" data-dk="${r.id}" x="${x}" y="${y}" width="${w}" height="${h}" fill="#0B1029"/>`;
    const lights=r.devices.filter(d=>d.k===L);const small=h<70;
    let pts=[];
    if(small){const x0=x+w*.62,x1=x+w-14;lights.forEach((d,i)=>pts.push([lights.length>1?x0+(x1-x0)*i/(lights.length-1):(x0+x1)/2,y+h/2]))}
    else{const ax=x+16,ay=y+(h>100?62:36),aw=w-32,ah=h-(h>100?62:38);const cols=Math.max(1,Math.ceil(Math.sqrt(lights.length*aw/Math.max(ah,1))));const rows=Math.ceil(lights.length/cols);
      lights.forEach((d,i)=>{const c=i%cols,rr=Math.floor(i/cols);pts.push([ax+aw*(c+.5)/cols,ay+ah*(rr+.5)/rows])})}
    lights.forEach((d,i)=>{const[px,py]=pts[i];const rad=Math.min(w,h)*.6;

  }

const CMD=/телевиз|ночник|камин|будильник|музык|громк|погод|сказк|таймер/;
function allPhrases(){const s=new Set(SCEN_WORDS);ROOMS.forEach(r=>roomWords(r).forEach(w=>s.add(norm(w))));return s}
function checkName(n){
  const t=n.trim();if(!t)return null;
  if(t.length>25)return['bad','Длиннее 25 букв — Алиса такое не примет.'];
  const bad=t.toLowerCase().match(CMD);if(bad)return['bad','Слово «'+bad[0]+'…» у Алисы — своя команда. Она запутается.'];
  if(/[a-z0-9]/i.test(t))return['warn','Лучше русскими буквами и без цифр.'];
  const nt=norm(t);
  if(nameMode==='dev'){const d=DEV[nameDev];
    if(allPhrases().has(nt))return['bad','Так называется комната или волшебное слово. Алиса запутается.'];
    for(const x of R[d.room].devices)for(const nm of namesOf(x))if(norm(nm)===nt)return x===d?['warn','Такое имя у этой лампы уже есть.']:['bad','Так уже зовут «'+x.kid+'». Алиса не поймёт, какую включить.'];
    for(const x of ALL)if(x.room!==d.room)for(const nm of namesOf(x))if(norm(nm)===nt)return['warn','Так зовут лампу в комнате «'+R[x.room].name+'». Без колонки рядом Алиса переспросит.'];
    if(t.split(/\s+/).length>3)return['warn','Длинновато. Попробуй покороче.'];
    return['ok','Отличное имя! Скажешь так: «Алиса, включи '+lc(t)+'»'];
  }
  if(allPhrases().has(nt))return['bad','Так уже называется комната или волшебное слово.'];
  for(const x of ALL)for(const nm of namesOf(x))if(norm(nm)===nt)return['bad','Так зовут лампу «'+x.kid+'». Алиса запутается.'];
  if(t.split(/\s+/).length>3)return['warn','Длинновато. Попробуй покороче.'];
  return['ok','Здорово! «Алиса, '+lc(t)+'» — и в комнате «'+R[nameRoom].name+'» погаснет свет.'];
}
function validateName(){
  const i=$('#nmInput'),c=$('#nmCheck');if(!i||!c)return;
  const res=checkName(i.value);
  if(!res){c.hidden=true;$('#nmAdd').disabled=true;return}
  c.hidden=false;c.className='check '+res[0];c.textContent=res[1];$('#nmAdd').disabled=res[0]==='bad';
}

}

/* ================= navigation ================= */
function go(s){
  screen=s;
  if(s==='hub')renderHub();
  if(s==='kv82'){view=P().home;ctxOverride=null;tab='room';sel=null;resetState(EVENING[P().home]);renderKv();bubble('','','Привет, '+P().name+'! Ты у себя в комнате. Нажми на лампу или напиши Алисе.')}
  if(s==='ai'){aiIdx=0;aiState=null;renderAI()}
  renderMe();window.scrollTo(0,0);
}
const EVENING={miron:['miron.up','miron.shelf','living.lyustra','living.divan','corr.podsv','kitchen.palka','bed.tv'],girls:['girls.desk','girls.yasya','living.lyustra','living.divan','corr.podsv','kitchen.palka','bed.tv']};

/* ================= events ================= */
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#homeBtn')){location.href='../#/hi/'+player;return}
  const pc=t.closest('.pcard');if(pc){player=pc.dataset.p;save();renderHub();renderMe();return}
  const wd=t.closest('[data-world]');if(wd){go(wd.dataset.world);return}
  const sp=t.closest('[data-say]');if(sp){speakNow(sp.dataset.say);return}
  if(screen==='ai'){
    const ao=t.closest('[data-aiopt]');if(ao){const k=+ao.dataset.aiopt,q=AIQ[aiIdx],ok=k===q.right;aiState={picked:k,ok,msg:q.opts[k].why||'',first:ok&&addStar('ai:'+aiIdx)};renderAI();if(ok)speak('Верно!');return}
    if(t.id==='aiNext'){aiIdx=(aiIdx+1)%AIQ.length;aiState=null;renderAI();return}
    return;
  }
  if(screen!=='kv82')return;
  const mr=t.closest('.mroom');if(mr){view=mr.dataset.room;ctxOverride=null;sel=null;if(tab==='quests')tab='room';renderScene();renderPanel();bubble('','','Ты зашёл в комнату «'+R[view].name+'».');return}
  if(t.closest('#toMap')){view='map';ctxOverride=null;sel=null;if(tab==='quests')tab='room';renderScene();renderPanel();return}
  const fxEl=t.closest('#svgHost [data-g]');
  if(fxEl){const d=DEV[fxEl.dataset.g];
    const v=S[d.gid]?(d.k===CUR?'закрой ':'выключи '):(d.k===CUR?'открой ':'включи ');
    const ph='Алиса, '+v+lc(d.kid);ctxOverride=null;const rep=run(ph,ctx());sel=d.gid;bubble(ph,rep);speak(ph);
    if(tab==='quests'){tab='room';qState=null}
    if(tab==='names'){nameMode='dev';nameDev=d.gid}
    renderPanel();return}
  const tb=t.closest('.tab');if(tb){tab=tb.dataset.tab;if(tab==='quests')startQuest();else if(ctxOverride){ctxOverride=null}renderPanel();return}
  if(t.id==='sndBtn'){sound[player]=!sound[player];save();renderPanel();return}
  const op=t.closest('[data-opt]');if(op){const k=+op.dataset.opt;answer(curQ().opts[k].p,k);return}
  if(t.id==='qNext'){qIdx[player]=(qIdx[player]+1)%QL().length;startQuest();renderPanel();return}
  if(t.id==='qAgain'){startQuest();renderPanel();return}
  if(t.id==='hintBtn'){$('#hintTxt').textContent=curQ().hint;return}
  const nm=t.closest('[data-nm]');if(nm){nameMode=nm.dataset.nm;renderPanel();return}
  const nd=t.closest('[data-nd]');if(nd){nameDev=nd.dataset.nd;renderPanel();return}
  const nr=t.closest('[data-nr]');if(nr){nameRoom=nr.dataset.nr;renderPanel();return}
  const dl=t.closest('[data-del]');if(dl){IDEAS.splice(+dl.dataset.del,1);save();renderScene();renderPanel();return}
  if(t.id==='copyBtn'){
    const txt=IDEAS.map(i=>i.kind==='dev'?`${R[i.room].name} · лампа «${DEV[i.room+'.'+i.dev].name}» → добавить имя «${i.name}» (${PLAYERS[i.who].name})`:`Сценарий «${R[i.room].words[0]}» (гасит ${R[i.room].name}) → добавить фразу «${i.name}» (${PLAYERS[i.who].name})`).join('\n');
    const m=$('#copyMsg');
    try{navigator.clipboard.writeText(txt).then(()=>m.textContent='Скопировано',()=>m.textContent=txt)}catch(err){m.textContent=txt}
    return}
});
document.addEventListener('input',e=>{if(e.target.id==='nmInput')validateName()});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='sayForm'){const v=$('#sayInput').value.trim();if(!v)return;const ph=/^алиса/i.test(v)?v:'Алиса, '+v;const rep=run(ph,ctx());bubble(ph,rep);speak(rep);$('#sayInput').value='';if(tab==='quests')qState=null;updateScene();if(tab==='room')renderPanel();return}
  if(e.target.id==='qForm'){const v=$('#qInput').value.trim();if(!v)return;answer(/^алиса/i.test(v)?v:'Алиса, '+v,null);return}
  if(e.target.id==='nmForm'){const v=$('#nmInput').value.trim();const res=checkName(v);if(!res||res[0]==='bad')return;
    let item,key;
    if(nameMode==='dev'){const d=DEV[nameDev];item={who:player,kind:'dev',room:d.room,dev:d.id,name:v};key='kv82:n:'+d.gid}
    else{item={who:player,kind:'room',room:nameRoom,name:v};key='kv82:nr:'+nameRoom}
    if(!IDEAS.some(i=>i.kind===item.kind&&i.room===item.room&&i.dev===item.dev&&norm(i.name)===norm(v)))IDEAS.push(item);
    const first=addStar(key);save();
    if(view==='map')renderScene();
    renderPanel();
    bubble('','',(first?'+1 звезда! ':'')+(nameMode==='dev'?'Попробуй: «Алиса, включи '+lc(v)+'»':'Попробуй: «Алиса, '+lc(v)+'»'));return}
});

/* ================= start ================= */
renderMe();
const h=(location.hash||'').slice(1);
go('kv82');
})();
</script>
